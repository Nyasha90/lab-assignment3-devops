---
# Lab 3 - Task 1: Configure infrastructure and automate application config
- name: Baseline configuration for all nodes
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name: [curl, vim, git, htop, ufw]
        state: present

    - name: Create application user
      ansible.builtin.user:
        name: appuser
        shell: /bin/bash
        state: present

- name: Deploy web application
  hosts: webservers
  become: true
  vars:
    app_title: "Lab 3 - DevSecOps Demo"
  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy index page from template
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"
      notify: Restart nginx

    - name: Allow SSH and HTTP through firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80"]

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Ensure nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify web server responds
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
